<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外游戏上升趋势 TOP20 · 日报</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --card2:#222735; --fg:#e8eaed; --sub:#9aa0aa; --accent:#5b8cff; --up:#3ecf8e; --new:#ffb648; --line:#2a3040; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; }
  header { padding:28px 20px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:22px; }
  header p { margin:0; color:var(--sub); font-size:13px; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 16px 60px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:18px 0; }
  .toolbar label { color:var(--sub); font-size:13px; }
  select { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; }
  .meta { color:var(--sub); font-size:13px; margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:transform .15s,border-color .15s; }
  .card:hover { transform:translateY(-3px); border-color:var(--accent); }
  .card .rank { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.72); color:#fff; font-weight:700; font-size:14px; padding:4px 10px; border-radius:20px; z-index:2; }
  .thumbwrap { position:relative; width:100%; aspect-ratio:16/9; background:var(--card2); overflow:hidden; }
  .thumb { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-ph { display:flex; align-items:center; justify-content:center; height:100%; color:#556; font-size:28px; }
  .cardbody { padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .title { font-size:15px; font-weight:700; line-height:1.35; }
  .title a { color:var(--fg); text-decoration:none; }
  .title a:hover { color:var(--accent); }
  .site-tag { display:inline-block; font-size:11px; color:var(--sub); background:var(--card2); border:1px solid var(--line); padding:2px 8px; border-radius:12px; align-self:flex-start; }
  .desc { font-size:12.5px; color:var(--sub); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .rankline { font-size:12px; color:var(--sub); margin-top:auto; }
  .delta { color:var(--up); font-weight:700; }
  .new { color:var(--new); font-weight:700; }
  .lang-switch { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .lang-switch button { background:var(--card2); color:var(--sub); border:0; padding:8px 14px; font-size:13px; cursor:pointer; }
  .lang-switch button.active { background:var(--accent); color:#fff; font-weight:700; }
  .empty { padding:60px 20px; text-align:center; color:var(--sub); }
  footer { padding:24px; text-align:center; color:#666; font-size:12px; border-top:1px solid var(--line); }
  .status { font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div>
        <h1 data-i18n="h1">海外游戏上升趋势 TOP20</h1>
        <p data-i18n="subtitle">每日抓取 CrazyGames · Game Jolt · Newgrounds · Kongregate · Coolmath 榜单，按名次差分算出上升最快的新游 · 供海外手游策划创意输入</p>
      </div>
      <div class="lang-switch">
        <button id="btnZh" class="active" type="button">中文</button>
        <button id="btnEn" type="button">EN</button>
      </div>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="toolbar">
    <label for="daySel" data-i18n="selectDate">选择日期：</label>
    <select id="daySel"></select>
    <span class="meta" id="meta"></span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none"></div>
</div>
<footer>
  <div id="foot"></div>
</footer>
<script>
const $ = s => document.querySelector(s);
let DATA = null;
let LANG = localStorage.getItem('trendLang') || 'zh';

const UI = {
  zh: {
    h1: '海外游戏上升趋势 TOP20',
    subtitle: '每日抓取 CrazyGames · Game Jolt · Newgrounds · Kongregate · Coolmath 榜单，按名次差分算出上升最快的新游 · 供海外手游策划创意输入',
    selectDate: '选择日期：', demo: '【示例数据】', latest: '（最新）',
    vs: '对比', risingGames: '款上升游戏', noRise: '本期榜单无上升项（两期快照间隔过短时属正常）。',
    newTag: '新上榜', prevRank: '上期', curRank: '本期', loadFail: '数据加载失败：',
    generatedAt: '数据生成时间：',
  },
  en: {
    h1: 'Overseas Games · Fastest Rising TOP20',
    subtitle: 'Daily crawl of CrazyGames · Game Jolt · Newgrounds · Kongregate · Coolmath charts; rank-differenced to surface the fastest climbers · for overseas mobile-game designers',
    selectDate: 'Date:', demo: '[SAMPLE DATA]', latest: ' (latest)',
    vs: 'vs', risingGames: 'rising games', noRise: 'No rising entries this period (normal when snapshots are close together).',
    newTag: 'New', prevRank: 'Prev', curRank: 'Now', loadFail: 'Data load failed:',
    generatedAt: 'Generated at:',
  },
};

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function t(){ return UI[LANG]; }
function setLang(lang){
  LANG = lang;
  localStorage.setItem('trendLang', lang);
  $('#btnZh').classList.toggle('active', lang==='zh');
  $('#btnEn').classList.toggle('active', lang==='en');
  document.documentElement.lang = lang==='zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t()[el.getAttribute('data-i18n')]; });
  if (DATA) {
    const sel = $('#daySel');
    [...sel.options].forEach(o => {
      const r = DATA.reports.find(x => x.date === o.value);
      if (r) o.textContent = r.date + (r.demo ? ' '+t().demo : '') + (r === DATA.reports[0] ? t().latest : '');
    });
    render(sel.value);
  }
}

function render(date) {
  if (!DATA) return;
  const L = t();
  const rep = DATA.reports.find(r => r.date === date);
  if (!rep) return;
  $('#meta').textContent = (rep.demo ? L.demo : '') + ` ${L.vs} ${rep.from} → ${rep.date} · ${rep.top.length} ${L.risingGames}`;
  const grid = $('#grid');
  grid.innerHTML = '';
  const empty = $('#empty');
  if (!rep.top.length) {
    empty.style.display = 'block';
    empty.textContent = L.noRise;
    return;
  }
  empty.style.display = 'none';
  rep.top.forEach((g, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const coverUrl = (g.cover || '').startsWith('//') ? 'https:' + g.cover : g.cover;
    const img = coverUrl
      ? `<img class="thumb" src="${esc(coverUrl)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const ph = `<div class="thumb-ph" style="${g.cover?'display:none':''}">🎮</div>`;
    const before = g.isNew ? `<span class="new">${L.newTag}</span>` : `${L.prevRank} ${g.rankBefore}/${g.nBefore}`;
    const delta = g.isNew ? '' : ` · <span class="delta">+${g.delta.toFixed(3)}</span>`;
    const showTitle = LANG==='zh' && g.titleZh ? g.titleZh : g.title;
    const showDesc  = LANG==='zh' && g.descZh  ? g.descZh  : g.desc;
    const desc = showDesc ? `<div class="desc">${esc(showDesc)}</div>` : '';
    card.innerHTML = `
      <div class="thumbwrap"><span class="rank">#${i+1}</span>${img}${ph}</div>
      <div class="cardbody">
        <div class="title"><a href="${esc(g.detail)}" target="_blank" rel="noopener">${esc(showTitle)}</a></div>
        <span class="site-tag">${esc(g.site)}</span>
        ${desc}
        <div class="rankline">${L.curRank} ${g.rankNow}/${g.nNow} · ${before}${delta}</div>
      </div>`;
    grid.appendChild(card);
  });
}

$('#btnZh').addEventListener('click', () => setLang('zh'));
$('#btnEn').addEventListener('click', () => setLang('en'));

fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  DATA = d;
  const sel = $('#daySel');
  d.reports.forEach((r, i) => {
    const o = document.createElement('option');
    o.value = r.date;
    o.textContent = r.date + (r.demo ? ' '+t().demo : '') + (i === 0 ? t().latest : '');
    sel.appendChild(o);
  });
  $('#foot').textContent = `${t().generatedAt} ${d.generatedAt} · ${d.note}`;
  setLang(LANG);
  if (d.reports.length) sel.value = d.reports[0].date;
  sel.addEventListener('change', e => render(e.target.value));
}).catch(e => {
  $('#empty').style.display = 'block';
  $('#empty').textContent = t().loadFail + e.message;
});
</script>
</body>
</html>
